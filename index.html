<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服飾商品查詢 Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #111827; }
    header { background: #111827; color: #fff; padding: 18px 24px; }
    .wrap { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    input, select { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font-size: 14px; }
    .summary { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .box { background: #fff; padding: 12px 18px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card img { width: 100%; height: 220px; object-fit: cover; background: #e5e7eb; display: block; }
    .info { padding: 12px; }
    .tag { font-size: 12px; background: #eef2ff; color: #3730a3; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-bottom: 6px; }
    .name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
    .price { font-weight: 700; font-size: 16px; }
  </style>
</head>
<body>
  <header><h2>服飾商品查詢 Dashboard</h2></header>
  <div class="wrap">
    <div class="bar">
      <input id="q" type="text" placeholder="搜尋名稱 / SKU / 顏色..." />
      <select id="cat">
        <option value="全部">全部類別</option>
        <option value="上衣">上衣</option>
        <option value="褲子">褲子</option>
        <option value="外套">外套</option>
        <option value="洋裝">洋裝</option>
        <option value="襯衫">襯衫</option>
        <option value="針織衫">針織衫</option>
      </select>
    </div>
    <div class="summary">
      <div class="box">顯示筆數：<strong id="cnt">0</strong></div>
      <div class="box">平均價格：<strong id="avg">$0</strong></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const API_BASE = "";
    const CATS = ["上衣", "褲子", "外套", "洋裝", "襯衫", "針織衫"];
    let items = [];

    function render(list) {
      document.getElementById("cnt").textContent = list.length;
      const avg = list.length ? Math.round(list.reduce((a, b) => a + Number(b.price || 0), 0) / list.length) : 0;
      document.getElementById("avg").textContent = "$" + avg;
      document.getElementById("grid").innerHTML = list.map(x => `
        <div class="card">
          <img src="${x.image_url}" alt="${x.name}" loading="lazy" />
          <div class="info">
            <span class="tag">${x.category || "未分類"}</span>
            <div class="name">${x.name}</div>
            <div class="sub">${x.sku} · ${x.color || "-"} · ${x.size || "-"}</div>
            <div class="price">$${Number(x.price || 0).toLocaleString()}</div>
          </div>
        </div>
      `).join("");
    }

    function filterNow() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const cat = document.getElementById("cat").value;
      render(items.filter(x =>
        (cat === "全部" || x.category === cat) &&
        (!q || (x.name || "").toLowerCase().includes(q) || (x.sku || "").toLowerCase().includes(q) || (x.color || "").toLowerCase().includes(q))
      ));
    }

    async function init() {
      if (API_BASE) {
        try {
          const r = await fetch(`${API_BASE}/api/products`);
          if (r.ok) { items = await r.json(); filterNow(); return; }
        } catch (e) {}
      }
      items = Array.from({ length: 60 }, (_, i) => {
        const n = String(i + 1).padStart(3, "0");
        return {
          sku: `SKU${n}`,
          name: `服飾 #${n}`,
          category: CATS[Math.floor(i / 10)] || "上衣",
          color: "經典色",
          price: 490 + (i % 8) * 150,
          size: "L",
          image_url: `https://raw.githubusercontent.com/brian54321-040/clothing-search/main/images/products/product-${n}.jpg`
        };
      });
      filterNow();
    }

    document.getElementById("q").addEventListener("input", filterNow);
    document.getElementById("cat").addEventListener("change", filterNow);
    init();
  </script>
</body>
</html>
